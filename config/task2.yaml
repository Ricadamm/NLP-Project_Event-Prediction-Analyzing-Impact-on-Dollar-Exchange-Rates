# Task 2 configuration: NLP feature extraction, modeling, and evaluation.
# See docs/task2_plan.md for the full rationale behind every choice here.

inputs:
  headlines_aligned: data/processed/cnbc_headlines_aligned.csv
  jisdor_daily: data/processed/cnbc_jisdor_daily.csv
  lm_dictionary: data/external/Loughran-McDonald_MasterDictionary_1993-2025.csv

categories:
  - armed_conflict
  - sanctions
  - trade_conflict
  - energy_geopolitics
  - political_instability
  - monetary_geoeconomic

text_preprocessing:
  # CNBC headline prefixes stripped before both TF-IDF and LM scoring.
  strip_prefixes:
    - "CNBC Pro:"
    - "CNBC Daily Open:"  # recurring newsletter boilerplate: 396/10,997 headlines (3.6%), checked directly
    - "Watch:"
    - "Live:"
    - "Op-ed:"
    - "Opinion:"

lm_sentiment:
  # Negation window: flip a Positive hit to Negative if one of these tokens
  # appears in the preceding `negation_window` tokens (Loughran-McDonald convention).
  # Contractions like "don't" are not reachable here: the shared word-boundary
  # tokenizer (\b\w\w+\b) splits "don't" into "don" only, since apostrophe is
  # not a word character. This is a known, documented limitation, not a bug.
  negation_words: ["no", "not", "never", "none", "without"]
  negation_window: 3

tfidf:
  ngram_range: [1, 2]
  min_df: 5
  max_df: 0.5
  sublinear_tf: true
  max_features: 5000
  svd_k_grid: [10, 20, 50]
  random_state: 42

target:
  # y_t = 1 if return_pct at t+1 is strictly positive, else 0 (includes ties at 0).
  horizon_days: 1

price_features:
  lag_returns: [0, 1, 2, 3, 4]
  momentum_windows: [5, 20]
  volatility_window: 20
  ma_distance_window: 20
  warm_up_days: 20

split:
  train_fraction: 0.70
  validation_fraction: 0.15
  test_fraction: 0.15
  purge_days: 1

models:
  random_state: 42
  logistic_grid:
    C: [0.01, 0.1, 1, 10]
    penalty: ["l2", "l1"]
    class_weight: [null, "balanced"]
  solver_by_penalty:
    l2: lbfgs
    l1: liblinear

evaluation:
  bootstrap:
    n_resamples: 1000
    block_size: 5
    random_state: 42
  walk_forward:
    refit_frequency: monthly
  decision_rule: >
    News adds predictive value only if the best NLP model (M1-M4) beats B2 on
    the test set in both directional accuracy and macro-F1, AND the McNemar
    test of M-best vs B2 on the same test days gives p < 0.05. Otherwise the
    result is reported as "no evidence of added value at this sample size".

outputs:
  interim_dir: data/interim/features
  processed_dir: data/processed
  reports_dir: reports
